# Root pnpm workspace. spikes/ are throwaway and keep their own lockfiles.
packages:
  - contracts
  - server
  - '!spikes/**'

# pi is pinned at exactly 1.0.1 (AGENTS.md); let it through pnpm's release-age gate.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.0.1'
  - '@earendil-works/pi-ai@1.0.1'
  - '@earendil-works/pi-telemetry@1.0.1'

# No install scripts are needed.
allowBuilds:
  '@google/genai': false
  protobufjs: false
